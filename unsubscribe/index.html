<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe | Caring Companions CDS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e3860">
<link rel="icon" href="/assets/icon-192.png">
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f7f3ec; color: #14304d; font: 18px/1.6 "Public Sans", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 16px; text-align: center; }
  img { width: 220px; max-width: 70%; height: auto; }
  h1 { font-size: 30px; line-height: 1.2; margin: 28px 0 12px; }
  p { color: #4c463c; margin: 0 0 14px; }
  a { color: #0f7a7c; font-weight: 600; }
</style>
</head>
<body>
<!-- 2026-11-11: the Unsubscribe link in the CDS worksheet welcome emails. ?t= is that person's own secret link;
     it stops their emails and nothing else. Not in the sitemap. No tracking on this page. -->
<main>
  <img src="/assets/logo.png" alt="Caring Companions Consumer Directed Services">
  <h1 id="h">One moment…</h1>
  <p id="p"></p>
  <p>Questions? Call <a href="tel:+14172182888">417-218-2888</a>, Monday to Friday, 9am to 4pm.</p>
  <p><a href="/">Back to caringcds.com</a></p>
</main>
<script>
(function () {
  var KEY = 'sb_publishable_iDJ00Ve4hw5iw2YtVmiulg__FmjShmO';
  var h = document.getElementById('h'), p = document.getElementById('p');
  var t = (new URLSearchParams(location.search).get('t') || '').trim();
  var show = function (a, b) { h.textContent = a; p.textContent = b; };
  if (t === 'test') { show('This is a test link', 'In a real email, this link stops that person\'s emails.'); return; }
  if (!/^[0-9a-f]{32}$/.test(t)) { show('This link is not complete', 'Please use the Unsubscribe link from the bottom of our email, or call us and we will take you off the list.'); return; }
  fetch('https://siivpekcaryeyttszwav.supabase.co/rest/v1/rpc/cds_email_unsubscribe', { method: 'POST',
    headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ t: t }) })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (found) {
      if (found === true) show('You are unsubscribed', 'You will not get any more welcome emails from Caring Companions CDS.');
      else show('This link is not complete', 'Please use the Unsubscribe link from the bottom of our email, or call us and we will take you off the list.');
    })
    .catch(function () { show('Something went wrong', 'Nothing was changed. Please try the link again in a minute, or call us and we will take you off the list.'); });
})();
</script>
</body>
</html>
